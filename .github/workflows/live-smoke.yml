name: Disposable live smoke

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "owner/name of the disposable repository"
        required: true
        type: string
      project_number:
        description: "Number of the disposable GitHub Project"
        required: true
        type: number
      disposable_confirmation:
        description: "Confirm this target is disposable and not a delivery board"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  live-smoke:
    name: live-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      repository-projects: read
    env:
      WHEELSPARROW_LIVE_SMOKE_DISPOSABLE: ${{ inputs.disposable_confirmation }}
      WHEELSPARROW_LIVE_SMOKE_REPOSITORY: ${{ inputs.repository }}
      WHEELSPARROW_LIVE_SMOKE_PROJECT_NUMBER: ${{ inputs.project_number }}
      GITHUB_TOKEN: ${{ secrets.WHEELSPARROW_LIVE_SMOKE_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install frozen dependencies
        run: make setup
      - name: Enforce disposable target gate
        run: |
          test "$WHEELSPARROW_LIVE_SMOKE_DISPOSABLE" = "true"
          test -n "$WHEELSPARROW_LIVE_SMOKE_REPOSITORY"
          test -n "$WHEELSPARROW_LIVE_SMOKE_PROJECT_NUMBER"
          test -n "$GITHUB_TOKEN"
          test "$WHEELSPARROW_LIVE_SMOKE_REPOSITORY" != "$GITHUB_REPOSITORY"
      - name: Exercise configured disposable project
        run: make live-smoke
      - name: Upload live-smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-smoke-failure-${{ github.run_id }}
          path: artifacts
          if-no-files-found: ignore
          retention-days: 14
