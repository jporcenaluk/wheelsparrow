name: Main artifact

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-artifact:
    name: build-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Verify and build exact revision
        run: |
          make verify-agent
          make build
          make smoke-production
      - name: Package exact revision
        run: |
          ARTIFACT_PATH="wheelsparrow-${GITHUB_SHA}.tar.gz"
          tar -czf "$ARTIFACT_PATH" \
            .node-version \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            apps/server/package.json \
            apps/server/dist \
            apps/web/package.json \
            apps/web/dist \
            packages/contracts/package.json \
            packages/contracts/dist \
            wheelsparrow.yaml \
            scripts/production-smoke.mjs
      - name: Verify packaged artifact
        run: |
          ARTIFACT_PATH="wheelsparrow-${GITHUB_SHA}.tar.gz"
          PACKAGE_DIR="$RUNNER_TEMP/wheelsparrow-${GITHUB_SHA}"
          mkdir -p "$PACKAGE_DIR"
          tar -xzf "$ARTIFACT_PATH" -C "$PACKAGE_DIR"
          cd "$PACKAGE_DIR"
          pnpm install --prod --frozen-lockfile --ignore-scripts
          node scripts/production-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheelsparrow-${{ github.sha }}
          path: wheelsparrow-${{ github.sha }}.tar.gz
          retention-days: 7
          if-no-files-found: error
