name: Main artifact

on:
  push:
    branches: [main]

permissions:
  checks: read
  contents: read

jobs:
  await-required-checks:
    name: await-required-checks
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Await same-revision required checks
        run: node scripts/await-required-checks.mjs

  build-artifact:
    name: build-artifact
    needs: await-required-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Verify and build exact revision
        run: |
          make verify-agent
          make build
          make smoke-production
      - name: Package exact revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > REVISION
          ARTIFACT_PATH="wheelsparrow-${GITHUB_SHA}.tar.gz"
          tar -czf "$ARTIFACT_PATH" \
            .node-version \
            REVISION \
            Makefile \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            tsconfig.base.json \
            apps/server/package.json \
            apps/server/src \
            apps/server/tsconfig.json \
            apps/server/dist \
            apps/web/package.json \
            apps/web/index.html \
            apps/web/src \
            apps/web/tsconfig.json \
            apps/web/vite.config.ts \
            apps/web/dist \
            packages/contracts/package.json \
            packages/contracts/prepare.mjs \
            packages/contracts/src \
            packages/contracts/tsconfig.json \
            packages/contracts/dist \
            migrations \
            prompts \
            wheelsparrow.yaml \
            scripts/live-smoke.mjs \
            scripts/await-required-checks.mjs \
            scripts/production-smoke.mjs
      - name: Verify packaged artifact
        run: |
          ARTIFACT_PATH="wheelsparrow-${GITHUB_SHA}.tar.gz"
          PACKAGE_DIR="$RUNNER_TEMP/wheelsparrow-${GITHUB_SHA}"
          mkdir -p "$PACKAGE_DIR"
          tar -xzf "$ARTIFACT_PATH" -C "$PACKAGE_DIR"
          test "$(cat "$PACKAGE_DIR/REVISION")" = "$GITHUB_SHA"
          test -s "$PACKAGE_DIR/prompts/builder.md"
          test -s "$PACKAGE_DIR/prompts/reviewer.md"
          test -s "$PACKAGE_DIR/prompts/repair.md"
          pnpm --dir "$PACKAGE_DIR" install --prod --frozen-lockfile
          node "$PACKAGE_DIR/scripts/production-smoke.mjs"
      - name: Upload build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-build-failure-${{ github.sha }}
          path: |
            wheelsparrow-*.tar.gz
            REVISION
            artifacts
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheelsparrow-${{ github.sha }}
          path: wheelsparrow-${{ github.sha }}.tar.gz
          retention-days: 7
          if-no-files-found: error
